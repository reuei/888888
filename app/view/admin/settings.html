<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>系统设置 - QEEFG授权站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f7fafc; color: #333333; line-height: 1.6; }
        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background-color: #000000; color: #ffffff; position: fixed; height: 100vh; overflow-y: auto; }
        .sidebar-header { padding: 1.5rem; border-bottom: 1px solid #2d2d2d; }
        .sidebar-logo { display: flex; align-items: center; color: #ffffff; text-decoration: none; font-size: 1.25rem; font-weight: 700; }
        .sidebar-logo-icon { width: 32px; height: 32px; background-color: #ffffff; color: #000000; display: flex; align-items: center; justify-content: center; margin-right: 0.75rem; font-weight: 700; }
        .sidebar-menu { padding: 1rem 0; }
        .menu-item { display: block; padding: 0.75rem 1.5rem; color: #a0aec0; text-decoration: none; transition: all 0.3s ease; font-weight: 500; }
        .menu-item:hover { background-color: #2d2d2d; color: #ffffff; }
        .menu-item.active { background-color: #2d2d2d; color: #ffffff; border-left: 3px solid #ffffff; }
        .main-content { flex: 1; margin-left: 250px; }
        .topbar { background-color: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 1rem 1.5rem; position: sticky; top: 0; z-index: 100; }
        .topbar-title { font-size: 1.25rem; font-weight: 700; color: #000000; }
        .content-area { padding: 1.5rem; }
        .settings-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; }
        .card { background: #ffffff; border: 1px solid #e2e8f0; padding: 1.5rem; margin-bottom: 1.5rem; }
        .card-title { font-size: 1.125rem; font-weight: 700; color: #000000; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid #e2e8f0; }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #4a5568; font-size: 0.9rem; }
        .form-input { width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; background-color: #ffffff; font-size: 1rem; transition: border-color 0.3s ease; }
        .form-input:focus { outline: none; border-color: #000000; }
        .form-hint { font-size: 0.85rem; color: #a0aec0; margin-top: 0.25rem; }
        .btn { display: inline-block; padding: 0.75rem 1.5rem; border: 2px solid #000000; background-color: #000000; color: #ffffff; text-decoration: none; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .btn:hover { background-color: #ffffff; color: #000000; }
        .btn-outline { background-color: #ffffff; color: #000000; }
        .btn-outline:hover { background-color: #000000; color: #ffffff; }
        .info-item { padding: 1rem 0; border-bottom: 1px solid #f7fafc; display: flex; justify-content: space-between; align-items: center; }
        .info-item:last-child { border-bottom: none; }
        .info-label { color: #718096; font-size: 0.9rem; }
        .info-value { color: #000000; font-weight: 600; }
        .switch { position: relative; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e0; transition: 0.4s; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: 0.4s; }
        input:checked + .slider { background-color: #000000; }
        input:checked + .slider:before { transform: translateX(24px); }
        @media (max-width: 1024px) { .settings-grid { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .sidebar { left: -250px; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/admin" class="sidebar-logo">
                    <div class="sidebar-logo-icon">Q</div>
                    <span>管理后台</span>
                </a>
            </div>
            <nav class="sidebar-menu">
                <a href="/admin" class="menu-item">首页</a>
                <a href="/admin/users" class="menu-item">用户管理</a>
                <a href="/admin/products" class="menu-item">产品管理</a>
                <a href="/admin/licenses" class="menu-item">授权管理</a>
                <a href="/admin/orders" class="menu-item">订单管理</a>
                <a href="/admin/settings" class="menu-item active">系统设置</a>
                <a href="/" class="menu-item">前台首页</a>
                <a href="/admin/logout" class="menu-item">退出登录</a>
            </nav>
        </aside>
        
        <main class="main-content">
            <div class="topbar">
                <div class="topbar-title">系统设置</div>
            </div>
            
            <div class="content-area">
                <div class="settings-grid">
                    <div>
                        <!-- 基本设置 -->
                        <div class="card">
                            <h3 class="card-title">基本设置</h3>
                            <form action="/admin/settings/basic" method="post">
                                <div class="form-group">
                                    <label class="form-label" for="site_name">网站名称</label>
                                    <input type="text" id="site_name" name="site_name" class="form-input" value="{$settings.site_name|default='QEEFG授权站'}">
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label" for="site_url">网站URL</label>
                                    <input type="text" id="site_url" name="site_url" class="form-input" value="{$settings.site_url|default=''}" placeholder="https://example.com">
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label" for="site_description">网站描述</label>
                                    <input type="text" id="site_description" name="site_description" class="form-input" value="{$settings.site_description|default='便捷快速的授权管理系统'}">
                                </div>
                                
                                <button type="submit" class="btn">保存设置</button>
                            </form>
                        </div>
                        
                        <!-- 邮件设置 -->
                        <div class="card">
                            <h3 class="card-title">邮件设置</h3>
                            <form action="/admin/settings/mail" method="post">
                                <div class="form-group">
                                    <label class="form-label" for="smtp_host">SMTP服务器</label>
                                    <input type="text" id="smtp_host" name="smtp_host" class="form-input" value="{$settings.smtp_host|default=''}" placeholder="smtp.qq.com">
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label" for="smtp_port">SMTP端口</label>
                                    <input type="text" id="smtp_port" name="smtp_port" class="form-input" value="{$settings.smtp_port|default='465'}">
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label" for="smtp_user">SMTP用户名</label>
                                    <input type="text" id="smtp_user" name="smtp_user" class="form-input" value="{$settings.smtp_user|default=''}">
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label" for="smtp_pass">SMTP密码</label>
                                    <input type="password" id="smtp_pass" name="smtp_pass" class="form-input" value="{$settings.smtp_pass|default=''}">
                                    <div class="form-hint">请填写邮箱授权码或密码</div>
                                </div>
                                
                                <button type="submit" class="btn">保存设置</button>
                            </form>
                        </div>
                        
                        <!-- 管理员密码 -->
                        <div class="card">
                            <h3 class="card-title">修改管理员密码</h3>
                            <form action="/admin/settings/password" method="post">
                                <div class="form-group">
                                    <label class="form-label" for="old_password">当前密码</label>
                                    <input type="password" id="old_password" name="old_password" class="form-input" required>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label" for="new_password">新密码</label>
                                    <input type="password" id="new_password" name="new_password" class="form-input" required>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label" for="confirm_password">确认新密码</label>
                                    <input type="password" id="confirm_password" name="confirm_password" class="form-input" required>
                                </div>
                                
                                <button type="submit" class="btn">修改密码</button>
                            </form>
                        </div>
                    </div>
                    
                    <div>
                        <!-- 系统信息 -->
                        <div class="card">
                            <h3 class="card-title">系统信息</h3>
                            <div class="info-item">
                                <div class="info-label">系统版本</div>
                                <div class="info-value">1.0.0</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">PHP版本</div>
                                <div class="info-value">{$php_version|default='8.0'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">数据库版本</div>
                                <div class="info-value">MySQL 5.7</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">服务器时间</div>
                                <div class="info-value">{$Think.date|date="Y-m-d H:i"}</div>
                            </div>
                        </div>
                        
                        <!-- 功能开关 -->
                        <div class="card">
                            <h3 class="card-title">功能开关</h3>
                            
                            <div class="info-item">
                                <div class="info-label">用户注册</div>
                                <label class="switch">
                                    <input type="checkbox" checked>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            
                            <div class="info-item">
                                <div class="info-label">邮件通知</div>
                                <label class="switch">
                                    <input type="checkbox" checked>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            
                            <div class="info-item">
                                <div class="info-label">授权验证</div>
                                <label class="switch">
                                    <input type="checkbox" checked>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            
                            <div class="info-item">
                                <div class="info-label">API接口</div>
                                <label class="switch">
                                    <input type="checkbox" checked>
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>
                        
                        <!-- 清除缓存 -->
                        <div class="card">
                            <h3 class="card-title">系统维护</h3>
                            <div style="color: #718096; font-size: 0.9rem; line-height: 1.6; margin-bottom: 1rem;">
                                <p>清除系统缓存可以解决部分显示问题。</p>
                            </div>
                            <button class="btn btn-outline">清除缓存</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
