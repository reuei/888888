<!-- 汉堡菜单 - 二级菜单结构 -->
<nav id="sideMenu" style="position: fixed; top: 0; left: -300px; width: 300px; height: 100vh; background-color: #ffffff; border-right: 1px solid #e2e8f0; z-index: 1000; transition: left 0.3s ease; overflow-y: auto;">
    <div style="padding: 1.5rem; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
        <div style="font-size: 1.25rem; font-weight: 700; color: #000000;">菜单</div>
        <button id="closeMenu" style="width: 30px; height: 30px; background: none; border: none; cursor: pointer; font-size: 1.5rem; color: #000000; display: flex; align-items: center; justify-content: center;">
            ×
        </button>
    </div>
    
    <div style="padding: 0;">
        <!-- 首页 -->
        <a href="/" style="display: block; padding: 1rem 1.5rem; color: #000000; text-decoration: none; border-bottom: 1px solid #f7fafc; font-weight: 500; transition: background-color 0.3s;">
            首页
        </a>
        
        <!-- 用户中心 - 二级菜单 -->
        <div style="border-bottom: 1px solid #f7fafc;">
            <div class="menu-item has-submenu" style="padding: 1rem 1.5rem; color: #000000; font-weight: 500; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background-color 0.3s;">
                <span>用户中心</span>
                <span style="transition: transform 0.3s;">▼</span>
            </div>
            <div class="submenu" style="display: none; background-color: #f7fafc;">
                <a href="/user/dashboard" style="display: block; padding: 0.75rem 2rem; color: #4a5568; text-decoration: none; border-bottom: 1px solid #ffffff; font-size: 0.9rem; transition: background-color 0.3s;">
                    用户中心首页
                </a>
                <a href="/user/workplace" style="display: block; padding: 0.75rem 2rem; color: #4a5568; text-decoration: none; border-bottom: 1px solid #ffffff; font-size: 0.9rem; transition: background-color 0.3s;">
                    工作台
                </a>
                <a href="/user/balance" style="display: block; padding: 0.75rem 2rem; color: #4a5568; text-decoration: none; border-bottom: 1px solid #ffffff; font-size: 0.9rem; transition: background-color 0.3s;">
                    余额管理
                </a>
                <a href="/user/products" style="display: block; padding: 0.75rem 2rem; color: #4a5568; text-decoration: none; border-bottom: 1px solid #ffffff; font-size: 0.9rem; transition: background-color 0.3s;">
                    产品中心
                </a>
                <a href="/user/my_products" style="display: block; padding: 0.75rem 2rem; color: #4a5568; text-decoration: none; border-bottom: 1px solid #ffffff; font-size: 0.9rem; transition: background-color 0.3s;">
                    我的产品
                </a>
                <a href="/user/settings" style="display: block; padding: 0.75rem 2rem; color: #4a5568; text-decoration: none; font-size: 0.9rem; transition: background-color 0.3s;">
                    账户设置
                </a>
            </div>
        </div>
        
        <!-- 产品服务 - 二级菜单 -->
        <div style="border-bottom: 1px solid #f7fafc;">
            <div class="menu-item has-submenu" style="padding: 1rem 1.5rem; color: #000000; font-weight: 500; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background-color 0.3s;">
                <span>产品服务</span>
                <span style="transition: transform 0.3s;">▼</span>
            </div>
            <div class="submenu" style="display: none; background-color: #f7fafc;">
                <a href="/user/products" style="display: block; padding: 0.75rem 2rem; color: #4a5568; text-decoration: none; border-bottom: 1px solid #ffffff; font-size: 0.9rem; transition: background-color 0.3s;">
                    产品列表
                </a>
                <a href="/user/my_products" style="display: block; padding: 0.75rem 2rem; color: #4a5568; text-decoration: none; font-size: 0.9rem; transition: background-color 0.3s;">
                    我的授权
                </a>
            </div>
        </div>
        
        <!-- 帮助支持 -->
        <div style="border-bottom: 1px solid #f7fafc;">
            <div class="menu-item has-submenu" style="padding: 1rem 1.5rem; color: #000000; font-weight: 500; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background-color 0.3s;">
                <span>帮助支持</span>
                <span style="transition: transform 0.3s;">▼</span>
            </div>
            <div class="submenu" style="display: none; background-color: #f7fafc;">
                <a href="#" style="display: block; padding: 0.75rem 2rem; color: #4a5568; text-decoration: none; border-bottom: 1px solid #ffffff; font-size: 0.9rem; transition: background-color 0.3s;">
                    使用帮助
                </a>
                <a href="#" style="display: block; padding: 0.75rem 2rem; color: #4a5568; text-decoration: none; font-size: 0.9rem; transition: background-color 0.3s;">
                    常见问题
                </a>
            </div>
        </div>
        
        <!-- 登录/注册（未登录时显示） -->
        {if condition="!isset($user) || !$user"}
        <a href="/user/login" style="display: block; padding: 1rem 1.5rem; color: #000000; text-decoration: none; border-bottom: 1px solid #f7fafc; font-weight: 500; transition: background-color 0.3s;">
            登录
        </a>
        <a href="/user/register" style="display: block; padding: 1rem 1.5rem; color: #000000; text-decoration: none; font-weight: 500; transition: background-color 0.3s;">
            注册
        </a>
        {else /}
        <a href="/user/logout" style="display: block; padding: 1rem 1.5rem; color: #000000; text-decoration: none; font-weight: 500; transition: background-color 0.3s;">
            退出登录
        </a>
        {/if}
    </div>
</nav>

<!-- 菜单遮罩层 -->
<div id="menuOverlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 999; display: none;"></div>

<script>
(function() {
    var menuToggle = document.getElementById('menuToggle');
    var sideMenu = document.getElementById('sideMenu');
    var closeMenu = document.getElementById('closeMenu');
    var menuOverlay = document.getElementById('menuOverlay');
    
    // 打开菜单
    if (menuToggle) {
        menuToggle.addEventListener('click', function() {
            sideMenu.style.left = '0';
            menuOverlay.style.display = 'block';
        });
    }
    
    // 关闭菜单
    function closeMenuFunc() {
        sideMenu.style.left = '-300px';
        menuOverlay.style.display = 'none';
    }
    
    if (closeMenu) {
        closeMenu.addEventListener('click', closeMenuFunc);
    }
    
    if (menuOverlay) {
        menuOverlay.addEventListener('click', closeMenuFunc);
    }
    
    // 二级菜单展开/收起
    var menuItems = document.querySelectorAll('.has-submenu');
    menuItems.forEach(function(item) {
        item.addEventListener('click', function() {
            var submenu = this.nextElementSibling;
            var arrow = this.querySelector('span:last-child');
            
            if (submenu.style.display === 'none') {
                submenu.style.display = 'block';
                arrow.style.transform = 'rotate(180deg)';
            } else {
                submenu.style.display = 'none';
                arrow.style.transform = 'rotate(0deg)';
            }
        });
    });
    
    // 鼠标悬停效果
    var links = sideMenu.querySelectorAll('a');
    links.forEach(function(link) {
        link.addEventListener('mouseenter', function() {
            this.style.backgroundColor = '#f7fafc';
        });
        link.addEventListener('mouseleave', function() {
            this.style.backgroundColor = '';
        });
    });
})();
</script>
