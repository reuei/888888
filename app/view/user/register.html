<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>注册 - QEEFG授权站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }
        
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem 0;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            text-decoration: none;
            color: #000000;
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-right: 10px;
            font-weight: 700;
        }
        
        .register-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        
        .register-box {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 2.5rem;
        }
        
        .register-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #000000;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        
        .register-subtitle {
            color: #718096;
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #4a5568;
            font-size: 0.9rem;
        }
        
        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            background-color: #ffffff;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #000000;
        }
        
        .form-hint {
            font-size: 0.85rem;
            color: #a0aec0;
            margin-top: 0.25rem;
        }
        
        .terms {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        
        .terms input {
            margin-top: 0.25rem;
        }
        
        .terms a {
            color: #000000;
            text-decoration: none;
            font-weight: 600;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 0.875rem;
            border: 2px solid #000000;
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 0;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background-color: #ffffff;
            color: #000000;
        }
        
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #718096;
            font-size: 0.9rem;
        }
        
        .login-link a {
            color: #000000;
            font-weight: 600;
            text-decoration: none;
        }
        
        .error-message {
            background-color: #fed7d7;
            color: #c53030;
            padding: 0.75rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            text-align: center;
        }
        
        @media (max-width: 480px) {
            .register-box {
                padding: 1.5rem;
            }
            
            .register-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">
                    <div class="logo-icon">Q</div>
                    <span>QEEFG</span>
                </a>
            </div>
        </div>
    </header>
    
    <div class="register-container">
        <div class="register-box">
            <h1 class="register-title">创建账户</h1>
            <p class="register-subtitle">注册成为QEEFG用户，开启授权之旅</p>
            
            {if condition="isset($error)"}
            <div class="error-message">{$error}</div>
            {/if}
            
            <form action="/user/register" method="post">
                <div class="form-group">
                    <label class="form-label" for="username">用户名</label>
                    <input type="text" id="username" name="username" class="form-input" placeholder="请输入用户名" required>
                    <div class="form-hint">用户名将用于登录和显示</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="email">邮箱地址</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="请输入邮箱地址" required>
                    <div class="form-hint">用于接收通知和找回密码</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">密码</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="请输入密码" required>
                    <div class="form-hint">密码长度至少6位</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="confirm_password">确认密码</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="请再次输入密码" required>
                </div>
                
                <div class="terms">
                    <input type="checkbox" id="agree" name="agree" required>
                    <label for="agree">我已阅读并同意 <a href="#">服务条款</a> 和 <a href="#">隐私政策</a></label>
                </div>
                
                <button type="submit" class="btn">注册</button>
            </form>
            
            <div class="login-link">
                已有账户？<a href="/user/login">立即登录</a>
            </div>
        </div>
    </div>
</body>
</html>
