<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{block name="title"}QEEFG授权站{/block}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }
        
        .flex {
            display: flex;
        }
        
        .flex-col {
            flex-direction: column;
        }
        
        .items-center {
            align-items: center;
        }
        
        .justify-between {
            justify-content: space-between;
        }
        
        .justify-center {
            justify-content: center;
        }
        
        .min-h-screen {
            min-height: 100vh;
        }
        
        .flex-1 {
            flex: 1;
        }
        
        .p-4 {
            padding: 1rem;
        }
        
        .p-6 {
            padding: 1.5rem;
        }
        
        .p-8 {
            padding: 2rem;
        }
        
        .mt-4 {
            margin-top: 1rem;
        }
        
        .mb-4 {
            margin-bottom: 1rem;
        }
        
        .mb-6 {
            margin-bottom: 1.5rem;
        }
        
        .text-center {
            text-align: center;
        }
        
        .text-2xl {
            font-size: 1.5rem;
        }
        
        .text-3xl {
            font-size: 1.875rem;
        }
        
        .text-4xl {
            font-size: 2.25rem;
        }
        
        .font-bold {
            font-weight: 700;
        }
        
        .text-gray-600 {
            color: #718096;
        }
        
        .text-gray-800 {
            color: #2d3748;
        }
        
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border: 2px solid #000000;
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            border-radius: 0;
        }
        
        .btn:hover {
            background-color: #ffffff;
            color: #000000;
        }
        
        .btn-outline {
            background-color: #ffffff;
            color: #000000;
            border: 2px solid #000000;
        }
        
        .btn-outline:hover {
            background-color: #000000;
            color: #ffffff;
        }
        
        .card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        
        .input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            background-color: #ffffff;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        
        .input:focus {
            outline: none;
            border-color: #000000;
        }
        
        .label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #4a5568;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .grid {
            display: grid;
            gap: 1rem;
        }
        
        .grid-cols-2 {
            grid-template-columns: repeat(2, 1fr);
        }
        
        .grid-cols-3 {
            grid-template-columns: repeat(3, 1fr);
        }
        
        .table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .table th, .table td {
            padding: 0.75rem;
            text-align: left;
            border: 1px solid #e2e8f0;
        }
        
        .table th {
            background-color: #f7fafc;
            font-weight: 600;
        }
        
        @media (max-width: 768px) {
            .grid-cols-2, .grid-cols-3 {
                grid-template-columns: 1fr;
            }
        }
    </style>
    {block name="style"}{/block}
</head>
<body>
    {include file="header" /}
    
    <main class="flex-1">
        {block name="content"}{/block}
    </main>
    
    {include file="footer" /}
    
    {block name="script"}{/block}
</body>
</html>
