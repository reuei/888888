        <!-- Logo -->
        <div style="display: flex; align-items: center;">
            <a href="/" style="text-decoration: none; color: #000000; font-size: 1.5rem; font-weight: 700; display: flex; align-items: center;">
                <div style="width: 40px; height: 40px; background-color: #000000; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin-right: 10px; font-weight: 700;">
                    Q
                </div>
                <span>QEEFG</span>

                <span style="width: 18px; height: 2px; background-color: #000000; display: block;"></span>
                <span style="width: 18px; height: 2px; background-color: #000000; display: block;"></span>
